name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint, tests, conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        # Install the project itself. The tests import `mandate`, so a hand-listed
        # set of third-party packages does not stand in for the package under test.
        run: pip install -e ".[dev]"

      - name: Lint
        # Nine findings are known and deliberate: best-effort `except Exception`
        # paths in service/{server,session,token_pool}.py, documented in CLAUDE.md.
        # They are not silenced with noqa, so this asserts the count has not grown
        # rather than pretending the tree is clean.
        run: |
          set +e
          ruff check src tests --output-format=concise > ruff.txt
          set -e
          COUNT=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+: ' ruff.txt || true)
          echo "ruff findings: $COUNT (documented baseline: 9)"
          cat ruff.txt
          if [ "$COUNT" -gt 9 ]; then
            echo "::error::ruff findings rose above the documented baseline of 9"
            exit 1
          fi

      - name: Tests
        run: pytest

      - name: Conformance
        # 200 trials per race attack. The trial count is load-bearing: a broken lock
        # shows as 1 breach in 200 and not at all in 25. Raise the timeout, never
        # lower --trials.
        run: python -m mandate.cli conformance
